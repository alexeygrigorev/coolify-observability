# VictoriaMetrics + VictoriaLogs + Vector on contabo-a (.163)
# vmui: http://10.100.0.1:8428/vmui  |  VL: http://10.100.0.1:9428/select/vmui
# No Grafana. Hard mem caps. Digests pinned.
name: coolify-obs-victoria

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    container_name: victoria-metrics
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=2d
      - -memory.allowedBytes=134217728
      - -search.maxUniqueTimeseries=300000
      - -promscrape.config=/etc/vm/prometheus.yml
      - -httpListenAddr=:8428
    volumes:
      - /data/obs/vm:/victoria-metrics-data
      - /data/obs/configs/vm/prometheus.yml:/etc/vm/prometheus.yml:ro
    network_mode: host
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.15.0-victorialogs
    container_name: victoria-logs
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=2d
      - -memory.allowedBytes=134217728
      - -httpListenAddr=:9428
    volumes:
      - /data/obs/vl:/victoria-logs-data
    network_mode: host
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"

  # f5d8e22b AC1: dedicated low-cardinality latency store, 30d retention.
  # Main VM stays 2d (47k series node/cadvisor would OOM at 30d under 256Mi);
  # latency series are ~dozens (traefik per-service + probe_ttfb/total),
  # so 30d fits comfortably in 256Mi. Push path:
  # healthcheck/deadman -> :8429/api/v1/import/prometheus (WG/SSH).
  victoria-metrics-latency:
    image: victoriametrics/victoria-metrics:v1.115.0
    container_name: victoria-metrics-latency
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-metrics-latency-data
      - -retentionPeriod=30d
      - -memory.allowedBytes=134217728
      - -search.maxUniqueTimeseries=50000
      - -promscrape.config=/etc/vm-latency/prometheus.latency.yml
      - -httpListenAddr=:8429
    volumes:
      - /data/obs/vm-latency:/victoria-metrics-latency-data
      - /data/obs/configs/vm/prometheus.latency.yml:/etc/vm-latency/prometheus.latency.yml:ro
    network_mode: host
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"

  vector-a:
    image: timberio/vector:0.60.0-debian
    container_name: vector-contabo-a
    restart: unless-stopped
    user: root
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - /data/obs/configs/vector/contabo-a/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/obs/vector-a:/var/lib/vector
    network_mode: host
    pid: host
    mem_limit: 128m
    cpus: "0.25"
    depends_on:
      - victoria-logs
      - victoria-metrics

  # bc9b3f30: stock alerting (ADR-0001). Approved t1468u. Drills to dev@ only.
  # Resource ceilings: blackbox 64M, vmalert 96M x2, alertmanager 96M, canary 16M.
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: obs-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - /data/obs/configs/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    network_mode: host
    mem_limit: 64m
    memswap_limit: 64m
    cpus: "0.25"

  vmalert-vm:
    image: victoriametrics/vmalert:v1.115.0
    container_name: obs-vmalert-vm
    restart: unless-stopped
    command:
      - -datasource.url=http://127.0.0.1:8428
      - -notifier.url=http://127.0.0.1:9093
      - -remoteWrite.url=http://127.0.0.1:8428
      - -remoteRead.url=http://127.0.0.1:8428
      - -evaluationInterval=30s
      - -rule=/etc/vmalert/rules-vm.yml
      - -external.label=fleet=contabo-coolify
      - -external.label=evaluator=vmalert-vm
      - -httpListenAddr=127.0.0.1:8880
    volumes:
      - /data/obs/rules/rules-vm.yml:/etc/vmalert/rules-vm.yml:ro
    network_mode: host
    mem_limit: 96m
    memswap_limit: 96m
    cpus: "0.25"
    depends_on:
      - victoria-metrics

  vmalert-vl:
    image: victoriametrics/vmalert:v1.115.0
    container_name: obs-vmalert-vl
    restart: unless-stopped
    command:
      - -datasource.url=http://127.0.0.1:9428
      - -rule.defaultRuleType=vlogs
      - -notifier.url=http://127.0.0.1:9093
      - -remoteWrite.url=http://127.0.0.1:8428
      - -remoteRead.url=http://127.0.0.1:8428
      - -evaluationInterval=2m
      - -rule=/etc/vmalert/rules-vl.yml
      - -external.label=fleet=contabo-coolify
      - -external.label=evaluator=vmalert-vl
      - -httpListenAddr=127.0.0.1:8881
    volumes:
      - /data/obs/rules/rules-vl.yml:/etc/vmalert/rules-vl.yml:ro
    network_mode: host
    mem_limit: 96m
    memswap_limit: 96m
    cpus: "0.25"
    depends_on:
      - victoria-logs
      - victoria-metrics

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: obs-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    volumes:
      - /data/obs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /data/alertmanager-data:/alertmanager
    network_mode: host
    mem_limit: 96m
    memswap_limit: 96m
    cpus: "0.25"

  # A5 canary: tiny sleep, always running; cadvisor exposes container_last_seen.
  obs-a5-canary:
    image: alpine:3.20
    container_name: obs-a5-canary
    restart: unless-stopped
    command: ["sleep", "infinity"]
    network_mode: none
    mem_limit: 16m
    memswap_limit: 16m
    cpus: "0.05"
