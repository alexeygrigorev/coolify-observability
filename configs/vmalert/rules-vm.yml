# vmalert VM rules — Contabo prod (reviewed, dev@ only)
# Datasource: http://127.0.0.1:8428 (main VM). Notifier: Alertmanager :9093.
# Each rule maps to tests/README.md repository IDs A1-A6 + A10 (f5d8e22b AC3).
# A7 lives in rules-vl.yml. A11 (probe TTFB) is covered by
# coolify-healthcheck/contabo-deadman scripts (probe_ttfb_seconds lives only
# in latency VM :8429, not in this vmalert's :8428 datasource).
# A8 is a routing property (retry), proven by every drill's mail.
# All thresholds are currently OK (no firing); drills make exactly one fire + clear.
# DECISION t1468u: approved for prod. t1493u AC3: real alerts -> prod-real
# (alexey@datatalks.club + dev@dtcdev.click); drills (drill=true or *_canary)
# -> dev@ only. Never mute real prod alerts.

groups:
- name: obs-a1-https
  interval: 30s
  rules:
  - alert: A1_https_down
    expr: probe_success{job="blackbox-https"} == 0
    for: 1m
    labels:
      severity: critical
      class: A1
    annotations:
      summary: "A1 HTTPS probe down (blackbox, prod-safe canary fault)"
      description: "probe_success==0 for 1m. Drill: firewall blackbox egress to one target only; clear: remove rule. Real site stays up."
  - alert: A1_blackbox_down
    expr: up{job="blackbox-https"} == 0
    for: 1m
    labels:
      severity: warning
      class: A1
    annotations:
      summary: "A1 blackbox prober scrape down"
      description: "Blackbox exporter itself unreachable; drill uses target egress block, not prober stop."

- name: obs-a2-disk
  interval: 30s
  rules:
  - alert: A2_disk_pressure
    expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
    for: 2m
    labels:
      severity: warning
      class: A2
    annotations:
      summary: "A2 root disk low (<15% free)"
      description: "Root filesystem free <15%. Real guard (currently ~89% free); drill uses synthetic canary below, never fills root."
  # t1493u AC1: real disk guards for ALL hosts (no host filter) and all real
  # mounts (fstype !~ tmpfs|overlay|squashfs|vfat|fuse.* per intake).
  # DiskFreeLow warn <15% free 10m; DiskFreeCritical <8% 5m; DiskFillsIn24h
  # predict_linear 6h trend, 24h horizon AND free <40%, 30m; inodes warn <10% /
  # crit <5%; per-host NodeExporterAbsent for contabo-a, contabo-b, hetzner.
  # host/mountpoint labels propagate from the scraped series (prometheus.yml
  # sets host per target); drill=true + *_canary route dev@ only (t1493u AC3),
  # everything real routes to prod-real (alexey@ + dev@). Never mute real alerts.
  - alert: A2_disk_warn
    expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.15
    for: 10m
    labels:
      severity: warning
      class: A2
    annotations:
      summary: "A2 disk space warn (<15% free, all hosts)"
      description: "Filesystem free <15% for 10m on any host/mount (real mounts only). Covers contabo-a, contabo-b and hetzner, all persistent mounts."
  - alert: A2_disk_crit
    expr: |
      (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.08)
      or
      (ALERTS{alertname="A2_disk_crit", alertstate="firing"} == 1 and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.10)
    for: 10m
    labels:
      severity: critical
      class: A2
    annotations:
      summary: "A2 disk space crit (<8% free with 10% hysteresis, all hosts)"
      description: "Filesystem free <8% for 10m (recovers >=10% free) on any host/mount (real mounts only). Immediate action; routes to prod receiver."
  - alert: A2_disk_fill_6h
    expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"}[6h], 21600) < 0 and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.15
    for: 30m
    labels:
      severity: critical
      class: A2
    annotations:
      summary: "A2 disk predicted full within 6h and <15% free (all hosts)"
      description: "6h trend predicts avail <0 within 6h and free <15% now, 30m sustained. Immediate action; routes to prod receiver."
  - alert: A2_disk_fill_predict
    expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"}[6h], 86400) < 0 and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.4
    for: 30m
    labels:
      severity: warning
      class: A2
    annotations:
      summary: "A2 disk predicted full within 24h (all hosts)"
      description: "6h trend predicts avail <0 within 24h and free <40% now, 30m sustained to avoid flapping on bursty writes."
  - alert: A2_disk_inodes_warn
    expr: node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.1
    for: 10m
    labels:
      severity: warning
      class: A2
    annotations:
      summary: "A2 disk inodes warn (<10% free, all hosts)"
      description: "Inode free <10% for 10m on any host/mount (real mounts only). Prevents no-space despite free bytes."
  - alert: A2_disk_inodes_crit
    expr: node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.05
    for: 10m
    labels:
      severity: critical
      class: A2
    annotations:
      summary: "A2 disk inodes crit (<5% free, all hosts)"
      description: "Inode free <5% for 10m on any host/mount (real mounts only). Immediate action; routes to prod receiver."
  # t1493u AC1: per-host NodeExporterAbsent (absent or up==0) for every expected
  # node host, so a dead agent or removed target pages even when no up series exists.
  - alert: A2_node_exporter_absent
    expr: absent(up{job="node",host="contabo-a"}) or up{job="node",host="contabo-a"} == 0
    for: 5m
    labels:
      severity: warning
      class: A2
      host: contabo-a
    annotations:
      summary: "A2 node_exporter absent/down on contabo-a"
      description: "No up{job=node} series or up==0 for contabo-a for 5m. Host or agent down; disk/RAM guards blind on this host."
  - alert: A2_node_exporter_absent
    expr: absent(up{job="node",host="contabo-b"}) or up{job="node",host="contabo-b"} == 0
    for: 5m
    labels:
      severity: warning
      class: A2
      host: contabo-b
    annotations:
      summary: "A2 node_exporter absent/down on contabo-b"
      description: "No up{job=node} series or up==0 for contabo-b for 5m. Host or agent down; disk/RAM guards blind on this host."
  - alert: A2_node_exporter_absent
    expr: absent(up{job="node",host="hetzner"}) or up{job="node",host="hetzner"} == 0
    for: 5m
    labels:
      severity: warning
      class: A2
      host: hetzner
    annotations:
      summary: "A2 node_exporter absent/down on hetzner"
      description: "No up{job=node} series or up==0 for hetzner for 5m. Host or SSH tunnel/agent down; disk guard blind on this host."
  # Live probe 2026-10-26: node_exporter does not expose /tmp/obs-a2 tmpfs (no series after 35s),
  # so the real tmpfs canary cannot fire. Synthetic canary proves vmalert->AM->dev@ path for A2 class.
  - alert: A2_disk_canary
    expr: obs_drill_disk_free_ratio < 0.2
    for: 1m
    labels:
      severity: warning
      class: A2
      drill: "true"
    annotations:
      summary: "A2 drill canary low (<20% free, synthetic)"
      description: "Drill: push obs_drill_disk_free_ratio 0.1 to fire, 0.9 to clear via VM import API. No host disk touched."

- name: obs-a3-ram
  interval: 30s
  rules:
  - alert: A3_ram_pressure
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
    for: 2m
    labels:
      severity: critical
      class: A3
    annotations:
      summary: "A3 host memory low (<10% available)"
      description: "Host MemAvailable <10%. Real guard (currently ~90% free); drill uses synthetic canary below, never exhausts host."
  # Live probe 2026-10-26: cadvisor exposes only system slices, no Docker container names/ids,
  # so container_memory_* canary cannot fire. Synthetic canary proves pipeline for A3 class.
  - alert: A3_canary_oom
    expr: obs_drill_mem_free_ratio < 0.2
    for: 1m
    labels:
      severity: warning
      class: A3
      drill: "true"
    annotations:
      summary: "A3 drill canary low (<20% free, synthetic)"
      description: "Drill: push obs_drill_mem_free_ratio 0.1 to fire, 0.9 to clear. Host RAM untouched."

- name: obs-a4-postgres
  interval: 30s
  rules:
  - alert: A4_postgres_down
    expr: up{job="postgres"} == 0 or pg_up == 0
    for: 1m
    labels:
      severity: critical
      class: A4
    annotations:
      summary: "A4 postgres exporter/pg down"
      description: "up{job=\"postgres\"}==0 or pg_up==0. Drill: stop exporter only (never PG) ≤2m; clear: restart exporter."

- name: obs-a5-container
  interval: 30s
  rules:
  # Live probe 2026-10-26: container_last_seen has no `name` label and no Docker ids
  # (only system.slice), so absent-by-name would false-fire. Synthetic canary instead.
  - alert: A5_canary_missing
    expr: obs_drill_container_healthy == 0
    for: 1m
    labels:
      severity: warning
      class: A5
      drill: "true"
    annotations:
      summary: "A5 drill canary unhealthy (synthetic)"
      description: "Drill: push obs_drill_container_healthy 0 to fire, 1 to clear. obs-a5-canary container runs as existence proof; health signal is synthetic."
  - alert: A5_cadvisor_down
    expr: up{job="cadvisor"} == 0
    for: 2m
    labels:
      severity: warning
      class: A5
    annotations:
      summary: "A5 cadvisor pipeline down"
      description: "Container metadata pipeline down; drill uses synthetic canary above, never touches app containers."

- name: obs-a6-scrape-gap
  interval: 30s
  rules:
  - alert: A6_scrape_gap
    expr: up{job="node"} == 0
    for: 2m
    labels:
      severity: warning
      class: A6
    annotations:
      summary: "A6 node scrape gap"
      description: "Drill: pause single node exporter ≤2m; clear: restart. Separate store-gap path via external healthcheck."
  - alert: A6_store_down
    expr: up{job="victoria-metrics"} == 0 or up{job="victoria-logs"} == 0
    for: 1m
    labels:
      severity: critical
      class: A6
    annotations:
      summary: "A6 store scrape down"
      description: "VM/VL scrape down. Full store outage uses external dead-man (healthcheck), not in-band vmalert alone."

- name: obs-a10-slowness
  interval: 30s
  rules:
  # t181f4832 (2026-10-27): first real A10 page was aisl-dev-source-web@file —
  # a dev service at ~0.02 req/s where ONE slow-client download per 5m window
  # pinned p95 at the 5s top bucket (every app-side handling was <100ms; pages
  # are ~90-150KB uncompressed, so a slow client link stretches the Traefik
  # end-to-end duration, not the app). Split + gated:
  #   * A10_service_p95_slow (critical) — prod-like services only
  #     (service!~".*dev.*"; live :8428 label set has no prod service matching),
  #     AND a real-traffic floor >= 0.05 req/s over 10m (~30 req) so a handful
  #     of slow requests on a low-traffic service cannot page.
  #   * A10_dev_service_p95_slow (warning) — dev/sandbox services, same
  #     threshold + floor; visible via dev-only mail but never critical.
  # Prod coverage: 2.5s threshold and for: 10m unchanged. The rate-independent
  # user-facing leg stays A11 probe TTFB (coolify-healthcheck/contabo-deadman,
  # probe_ttfb_seconds on latency VM :8429). RECOVERED + dev-only mail routing
  # unchanged (alertmanager send_resolved=true).
  # f5d8e22b AC3 hysteresis (2026-10-30): each rule stays FIRING while p95 is
  # above the 2.0s recovery threshold (or-branch on its own firing ALERTS
  # series), so flapping around 2.5s cannot thrash FAIL/RECOVERED mail — it
  # resolves only when p95 falls <= 2.0s (or traffic dies: rate() then has no
  # buckets, the quantile goes empty and the hysteresis branch drops out).
  # Mail routes to dev@dtcdev.click ONLY from alerts@dtcdev.click via the
  # alertmanager `class="A10"` route -> slowness-dev receiver (never prod-real).
  - alert: A10_service_p95_slow
    expr: |
      (
        (
          histogram_quantile(0.95, sum by (service, le) (
            rate(traefik_service_request_duration_seconds_bucket{service!~".*dev.*"}[5m])
          )) > 2.5
        )
        and on (service)
        (
          sum by (service) (rate(traefik_service_requests_total{service!~".*dev.*"}[10m])) >= 0.05
        )
      )
      or on (service)
      (
        max by (service) (ALERTS{alertname="A10_service_p95_slow", alertstate="firing"} == 1)
        and on (service)
        histogram_quantile(0.95, sum by (service, le) (
          rate(traefik_service_request_duration_seconds_bucket{service!~".*dev.*"}[5m])
        )) > 2.0
      )
    for: 10m
    labels:
      severity: critical
      class: A10
    annotations:
      summary: "A10 service p95 response time > 2.5s for 10m (prod services, real traffic)"
      description: "Traefik per-service p95 above 2.5s sustained 10m on main VM :8428, prod-like services (name without 'dev') with rate >= 0.05 req/s over 10m (t181f4832: low-traffic trickle cannot page; dev services have a separate warning rule). Hysteresis: stays firing while p95 > 2.0s, resolves (RECOVERED) at <= 2.0s. Probe-TTFB leg (A11) is covered by coolify-healthcheck/contabo-deadman scripts (probe_ttfb_seconds, latency VM :8429 only). Mail is dev-only from alerts@dtcdev.click via the alertmanager class=A10 slowness route (repeat <=1/h, RECOVERED on clear). Drill: push a synthetic slow prod-service series to :8428 (never shape prod traffic, never mute real alerts); clear: remove the series."
  - alert: A10_dev_service_p95_slow
    expr: |
      (
        (
          histogram_quantile(0.95, sum by (service, le) (
            rate(traefik_service_request_duration_seconds_bucket{service=~".*dev.*"}[5m])
          )) > 2.5
        )
        and on (service)
        (
          sum by (service) (rate(traefik_service_requests_total{service=~".*dev.*"}[10m])) >= 0.05
        )
      )
      or on (service)
      (
        max by (service) (ALERTS{alertname="A10_dev_service_p95_slow", alertstate="firing"} == 1)
        and on (service)
        histogram_quantile(0.95, sum by (service, le) (
          rate(traefik_service_request_duration_seconds_bucket{service=~".*dev.*"}[5m])
        )) > 2.0
      )
    for: 10m
    labels:
      severity: warning
      class: A10
    annotations:
      summary: "A10 dev service p95 response time > 2.5s for 10m (warning, not a page)"
      description: "Same 2.5s/10m threshold, >= 0.05 req/s traffic floor and 2.0s recovery hysteresis as the critical rule, but for dev/sandbox services (name contains 'dev'); downgraded to warning by t181f4832 so dev trickle traffic cannot page. Still dev-only mail from alerts@dtcdev.click with RECOVERED. Resolves when p95 <= 2.0s or traffic drops below the floor."
