# vmalert VM rules — Contabo prod.
# Datasource: http://127.0.0.1:8428 (main VM). Notifier: Alertmanager :9093.
# Each rule maps to tests/README.md repository IDs A1-A6 + A10 (f5d8e22b AC3).
# A7 lives in rules-vl.yml. A11 (probe TTFB) is covered by
# coolify-healthcheck/contabo-deadman scripts (probe_ttfb_seconds lives only
# in latency VM :8429, not in this vmalert's :8428 datasource).
# A8 is a routing property (retry), proven by every drill's mail.
# All thresholds are currently OK (no firing); canary drills make one fire + clear.
# DECISION t1468u: approved for prod. t1493u AC3: real alerts -> prod-real
# (dev@dtcdev.click only); drills (drill=true or *_canary)
# -> dev@ only. Never mute real prod alerts.

groups:
- name: obs-a1-https
  interval: 30s
  rules:
  - alert: A1_https_down
    expr: probe_success{job="blackbox-https"} == 0
    for: 1m
    # t2813u/t2814u: stay firing until 5 min green so a flapping probe is one
    # incident, never FIRING/RESOLVED/FIRING/RESOLVED.
    keep_firing_for: 5m
    labels:
      severity: critical
      class: A1
    annotations:
      summary: "A1 production HTTPS target unavailable"
      description: "The HTTPS probe for {{ $labels.instance }} has failed continuously for 1m. Check the affected service, edge proxy, and recent deploys; restore HTTPS availability."
  - alert: A1_https_canary
    expr: probe_success{job="blackbox-https-canary"} == 0
    for: 1m
    labels:
      severity: warning
      class: A1
      drill: "true"
    annotations:
      summary: "A1 HTTPS alert-path canary probe failed"
      description: "Local routing drill only. Stop obs-a1-https-canary to fire and start it to clear; production HTTPS targets are not changed."
  - alert: A1_blackbox_down
    expr: up{job="blackbox-https"} == 0
    for: 1m
    labels:
      severity: warning
      class: A1
    annotations:
      summary: "A1 blackbox prober scrape down"
      description: "The blackbox exporter has been unreachable for 1m. Check the exporter and its host; target probe failures are reported by A1_https_down."

- name: obs-a2-disk
  interval: 30s
  rules:
  # t1885u / 3bf25bda (2026-10-29): remove duplicate 2m root-disk pressure
  # alert. A2_disk_warn is the single sustained <15% warning; the warning
  # route sends it to dev-only, while critical disk alerts remain actionable.
  # t1493u AC1: real disk guards for ALL hosts (no host filter) and all real
  # mounts (fstype !~ tmpfs|overlay|squashfs|vfat|fuse.* per intake).
  # DiskFreeLow warn <15% free 10m; DiskFreeCritical <8% 5m; DiskFillsIn24h
  # predict_linear 6h trend, 24h horizon AND free <40%, 30m; inodes warn <10% /
  # crit <5%; per-host NodeExporterAbsent for contabo-a, contabo-b, hetzner.
  # host/mountpoint labels propagate from the scraped series (prometheus.yml
  # sets host per target); drill=true + *_canary route dev@ only (t1493u AC3),
  # everything real routes to prod-real (alexey@ + dev@). Never mute real alerts.
  - alert: A2_disk_warn
    expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.15
    for: 10m
    labels:
      severity: warning
      class: A2
    annotations:
      summary: "A2 disk space warn on {{ $labels.host }} mount {{ $labels.mountpoint }} (<15% free)"
      description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.host }} stayed below 15% free for 10m (real mounts only)."
  - alert: A2_disk_crit
    expr: |
      (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.08)
      or
      (ALERTS{alertname="A2_disk_crit", alertstate="firing"} == 1 and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.10)
    for: 10m
    labels:
      severity: critical
      class: A2
    annotations:
      summary: "A2 disk space crit on {{ $labels.host }} mount {{ $labels.mountpoint }} (<8% free; 10% recovery hysteresis)"
      description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.host }} stayed below 8% free for 10m and recovers at >=10% free (real mounts only). Immediate action; routes to prod receiver."
  - alert: A2_disk_fill_6h
    expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"}[6h], 21600) < 0 and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.15
    for: 30m
    labels:
      severity: critical
      class: A2
    annotations:
      summary: "A2 disk on {{ $labels.host }} mount {{ $labels.mountpoint }} predicted full within 6h (<15% free)"
      description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.host }} has <15% free and its 6h trend predicts no available space within 6h for 30m. Immediate action; routes to prod receiver."
  - alert: A2_disk_fill_predict
    expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"}[6h], 86400) < 0 and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.4
    for: 30m
    labels:
      severity: warning
      class: A2
    annotations:
      summary: "A2 disk on {{ $labels.host }} mount {{ $labels.mountpoint }} predicted full within 24h"
      description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.host }} has <40% free and its 6h trend predicts no available space within 24h for 30m to avoid flapping on bursty writes."
  - alert: A2_disk_inodes_warn
    expr: node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.1
    for: 10m
    labels:
      severity: warning
      class: A2
    annotations:
      summary: "A2 disk inodes warn on {{ $labels.host }} mount {{ $labels.mountpoint }} (<10% free)"
      description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.host }} stayed below 10% free inodes for 10m (real mounts only). This can cause no-space errors despite free bytes."
  - alert: A2_disk_inodes_crit
    expr: node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|vfat|fuse.*"} < 0.05
    for: 10m
    labels:
      severity: critical
      class: A2
    annotations:
      summary: "A2 disk inodes crit on {{ $labels.host }} mount {{ $labels.mountpoint }} (<5% free)"
      description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.host }} stayed below 5% free inodes for 10m (real mounts only). Immediate action; routes to prod receiver."
  # t1493u AC1: per-host NodeExporterAbsent (absent or up==0) for every expected
  # node host, so a dead agent or removed target pages even when no up series exists.
  - alert: A2_node_exporter_absent
    expr: absent(up{job="node",host="contabo-a"}) or up{job="node",host="contabo-a"} == 0
    for: 5m
    labels:
      severity: warning
      class: A2
      host: contabo-a
    annotations:
      summary: "A2 node_exporter absent/down on contabo-a"
      description: "No up{job=node} series or up==0 for contabo-a for 5m. Host or agent down; disk/RAM guards blind on this host."
  - alert: A2_node_exporter_absent
    expr: absent(up{job="node",host="contabo-b"}) or up{job="node",host="contabo-b"} == 0
    for: 5m
    labels:
      severity: warning
      class: A2
      host: contabo-b
    annotations:
      summary: "A2 node_exporter absent/down on contabo-b"
      description: "No up{job=node} series or up==0 for contabo-b for 5m. Host or agent down; disk/RAM guards blind on this host."
  - alert: A2_node_exporter_absent
    expr: absent(up{job="node",host="hetzner"}) or up{job="node",host="hetzner"} == 0
    for: 5m
    labels:
      severity: warning
      class: A2
      host: hetzner
    annotations:
      summary: "A2 node_exporter absent/down on hetzner"
      description: "No up{job=node} series or up==0 for hetzner for 5m. Host or SSH tunnel/agent down; disk guard blind on this host."
  # Live probe 2026-10-26: node_exporter does not expose /tmp/obs-a2 tmpfs (no series after 35s),
  # so the real tmpfs canary cannot fire. Synthetic canary proves vmalert->AM->dev@ path for A2 class.
  - alert: A2_disk_canary
    expr: obs_drill_disk_free_ratio < 0.2
    for: 1m
    labels:
      severity: warning
      class: A2
      drill: "true"
    annotations:
      summary: "A2 drill canary low (<20% free, synthetic)"
      description: "Drill: push obs_drill_disk_free_ratio 0.1 to fire, 0.9 to clear via VM import API. No host disk touched."

- name: obs-a3-ram
  interval: 30s
  rules:
  - alert: A3_ram_pressure
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
    for: 2m
    labels:
      severity: critical
      class: A3
    annotations:
      summary: "A3 host memory low (<10% available)"
      description: "Host MemAvailable <10%. Real guard (currently ~90% free); drill uses synthetic canary below, never exhausts host."
  # Keep this synthetic memory canary independent of cAdvisor labels; real
  # per-container memory and OOM alerts are in obs-f4-infra-health below.
  - alert: A3_canary_oom
    expr: obs_drill_mem_free_ratio < 0.2
    for: 1m
    labels:
      severity: warning
      class: A3
      drill: "true"
    annotations:
      summary: "A3 drill canary low (<20% free, synthetic)"
      description: "Drill: push obs_drill_mem_free_ratio 0.1 to fire, 0.9 to clear. Host RAM untouched."

- name: obs-a4-postgres
  interval: 30s
  rules:
  - alert: A4_postgres_down
    expr: up{job="postgres"} == 0 or pg_up == 0
    for: 1m
    labels:
      severity: critical
      class: A4
    annotations:
      summary: "A4 postgres exporter/pg down"
      description: "up{job=\"postgres\"}==0 or pg_up==0. Drill: stop exporter only (never PG) ≤2m; clear: restart exporter."

- name: obs-a5-container
  interval: 30s
  rules:
  # Keep the synthetic canary for end-to-end alert-path drills. Real cAdvisor
  # health and restart alerts are enabled in obs-h5-host-health below.
  - alert: A5_canary_missing
    expr: obs_drill_container_healthy == 0
    for: 1m
    labels:
      severity: warning
      class: A5
      drill: "true"
    annotations:
      summary: "A5 drill canary unhealthy (synthetic)"
      description: "Drill: push obs_drill_container_healthy 0 to fire, 1 to clear. obs-a5-canary container runs as existence proof; health signal is synthetic."
  - alert: A5_cadvisor_down
    expr: up{job="cadvisor"} == 0
    for: 2m
    labels:
      severity: warning
      class: A5
    annotations:
      summary: "A5 cadvisor pipeline down"
      description: "Container metadata pipeline down; drill uses synthetic canary above, never touches app containers."

- name: obs-a6-scrape-gap
  interval: 30s
  rules:
  - alert: A6_scrape_gap
    expr: up{job="node"} == 0
    for: 2m
    labels:
      severity: warning
      class: A6
    annotations:
      summary: "A6 node scrape gap"
      description: "Drill: pause single node exporter ≤2m; clear: restart. Separate store-gap path via external healthcheck."
  - alert: A6_store_down
    expr: up{job="victoria-metrics"} == 0 or up{job="victoria-logs"} == 0
    for: 1m
    labels:
      severity: critical
      class: A6
    annotations:
      summary: "A6 store scrape down"
      description: "VM/VL scrape down. Full store outage uses external dead-man (healthcheck), not in-band vmalert alone."

- name: obs-a10-slowness
  interval: 30s
  rules:
  # t181f4832 (2026-10-27): first real A10 page was aisl-dev-source-web@file —
  # a dev service at ~0.02 req/s where ONE slow-client download per 5m window
  # pinned p95 at the 5s top bucket (every app-side handling was <100ms; pages
  # are ~90-150KB uncompressed, so a slow client link stretches the Traefik
  # end-to-end duration, not the app). Split + gated:
  #   * A10_service_p95_slow (critical) — prod-like services only
  #     (service!~".*dev.*"; live :8428 label set has no prod service matching),
  #     AND a real-traffic floor >= 0.05 req/s over 10m (~30 req) so a handful
  #     of slow requests on a low-traffic service cannot page.
  #   * A10_dev_service_p95_slow (warning) — dev/sandbox services, same
  #     threshold + floor; visible via dev-only mail but never critical.
  # Prod coverage: 2.5s threshold and for: 10m unchanged. The rate-independent
  # user-facing leg stays A11 probe TTFB (coolify-healthcheck/contabo-deadman,
  # probe_ttfb_seconds on latency VM :8429). RECOVERED + dev-only mail routing
  # unchanged (alertmanager send_resolved=true).
  # f5d8e22b AC3 hysteresis (2026-10-30): each rule stays FIRING while p95 is
  # above the 2.0s recovery threshold (or-branch on its own firing ALERTS
  # series), so flapping around 2.5s cannot thrash FAIL/RECOVERED mail — it
  # resolves only when p95 falls <= 2.0s (or traffic dies: rate() then has no
  # buckets, the quantile goes empty and the hysteresis branch drops out).
  # Mail routes to dev@dtcdev.click ONLY from alerts@dtcdev.click via the
  # alertmanager `class="A10"` route -> slowness-dev receiver (never prod-real).
  - alert: A10_service_p95_slow
    expr: |
      (
        (
          histogram_quantile(0.95, sum by (service, le) (
            rate(traefik_service_request_duration_seconds_bucket{service!~".*dev.*"}[5m])
          )) > 2.5
        )
        and on (service)
        (
          sum by (service) (rate(traefik_service_requests_total{service!~".*dev.*"}[10m])) >= 0.05
        )
      )
      or on (service)
      (
        max by (service) (ALERTS{alertname="A10_service_p95_slow", alertstate="firing"} == 1)
        and on (service)
        histogram_quantile(0.95, sum by (service, le) (
          rate(traefik_service_request_duration_seconds_bucket{service!~".*dev.*"}[5m])
        )) > 2.0
      )
    for: 10m
    labels:
      severity: critical
      class: A10
    annotations:
      summary: "A10 service p95 response time > 2.5s for 10m (prod services, real traffic)"
      description: "Traefik per-service p95 above 2.5s sustained 10m on main VM :8428, prod-like services (name without 'dev') with rate >= 0.05 req/s over 10m (t181f4832: low-traffic trickle cannot page; dev services have a separate warning rule). Hysteresis: stays firing while p95 > 2.0s, resolves (RECOVERED) at <= 2.0s. Probe-TTFB leg (A11) is covered by coolify-healthcheck/contabo-deadman scripts (probe_ttfb_seconds, latency VM :8429 only). Mail is dev-only from alerts@dtcdev.click via the alertmanager class=A10 slowness route (repeat <=1/h, RECOVERED on clear). Drill: push a synthetic slow prod-service series to :8428 (never shape prod traffic, never mute real alerts); clear: remove the series."
  - alert: A10_dev_service_p95_slow
    expr: |
      (
        (
          histogram_quantile(0.95, sum by (service, le) (
            rate(traefik_service_request_duration_seconds_bucket{service=~".*dev.*"}[5m])
          )) > 2.5
        )
        and on (service)
        (
          sum by (service) (rate(traefik_service_requests_total{service=~".*dev.*"}[10m])) >= 0.05
        )
      )
      or on (service)
      (
        max by (service) (ALERTS{alertname="A10_dev_service_p95_slow", alertstate="firing"} == 1)
        and on (service)
        histogram_quantile(0.95, sum by (service, le) (
          rate(traefik_service_request_duration_seconds_bucket{service=~".*dev.*"}[5m])
        )) > 2.0
      )
    for: 10m
    labels:
      severity: warning
      class: A10
    annotations:
      summary: "A10 dev service p95 response time > 2.5s for 10m (warning, not a page)"
      description: "Same 2.5s/10m threshold, >= 0.05 req/s traffic floor and 2.0s recovery hysteresis as the critical rule, but for dev/sandbox services (name contains 'dev'); downgraded to warning by t181f4832 so dev trickle traffic cannot page. Still dev-only mail from alerts@dtcdev.click with RECOVERED. Resolves when p95 <= 2.0s or traffic drops below the floor."

- name: obs-f4-infra-health
  interval: 30s
  rules:
  - alert: F4_all_backends_down
    expr: max by (host, service) (traefik_service_server_up) == 0
    for: 20s
    labels:
      severity: critical
      class: F4
    annotations:
      summary: "F4 all Traefik backends down for {{ $labels.service }} on {{ $labels.host }}"
      description: "Traefik reports no healthy backend for this service. Check the app, proxy, and recent deploy; this alert routes through the real-incident email receiver."
  - alert: F4_5xx_rate_high
    expr: sum by (host, router) (rate(traefik_router_requests_total{code=~"502|503|504"}[1m])) > 1
    for: 1m
    labels:
      severity: critical
      class: F4
    annotations:
      summary: "F4 elevated 5xx rate on {{ $labels.router }} at {{ $labels.host }}"
      description: "Traefik has served more than 1 502/503/504 response per second for at least 1m. Check backend health and host pressure."
  - alert: F4_cpu_pressure_high
    expr: rate(node_pressure_cpu_waiting_seconds_total[2m]) > 0.3
    for: 3m
    labels:
      severity: warning
      class: F4
    annotations:
      summary: "F4 CPU pressure high on {{ $labels.host }}"
      description: "Linux CPU pressure has exceeded 30% for 3m. Check worker load and healthcheck churn."
  - alert: F4_host_load_high
    expr: node_load1 > 16
    for: 5m
    labels:
      severity: warning
      class: F4
    annotations:
      summary: "F4 host load high on {{ $labels.host }}"
      description: "The 1-minute load average has exceeded 16 for 5m. Check CPU saturation and waiting tasks."
  - alert: H2_container_memory_high
    expr: |
      (
        max by (host, name) (container_memory_working_set_bytes{name!=""})
        /
        max by (host, name) (container_spec_memory_limit_bytes{name!=""})
      ) > 0.85
      and on (host, name)
      max by (host, name) (container_spec_memory_limit_bytes{name!=""}) > 0
      and on (host, name)
      max by (host, name) (container_spec_memory_limit_bytes{name!=""}) < 1e14
    for: 5m
    labels:
      severity: warning
      class: H2
    annotations:
      summary: "H2 container memory above 85% of limit: {{ $labels.name }} on {{ $labels.host }}"
      description: "Container working set stayed above 85% of its configured memory limit for 5m. Check the container before it reaches its cgroup limit."
  - alert: H2_container_oom_kill
    expr: increase(container_oom_events_total{name!=""}[5m]) > 0
    labels:
      severity: critical
      class: H2
    annotations:
      summary: "H2 container OOM event: {{ $labels.name }} on {{ $labels.host }}"
      description: "cAdvisor recorded an OOM event in the last 5m. Inspect the affected container and its memory limit."

- name: obs-h5-host-health
  interval: 30s
  rules:
  - alert: H5_traefik_metrics_down
    expr: up{job="traefik"} == 0
    for: 1m
    labels:
      severity: warning
      class: H5
    annotations:
      summary: "H5 Traefik metrics unavailable on {{ $labels.host }}"
      description: "The internal Traefik metrics endpoint has failed to scrape for 1m; proxy status and 5xx alerts may be blind."
  - alert: H5_certificate_expiring_14d
    expr: |
      (probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time() < 1209600)
      and
      (probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time() >= 604800)
    for: 5m
    labels:
      severity: warning
      class: H5
    annotations:
      summary: "H5 TLS certificate expires within 14 days: {{ $labels.instance }}"
      description: "The certificate expiry metric is within 14 days. Renew it before requests start failing."
  - alert: H5_certificate_expiring_7d
    expr: probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time() < 604800
    for: 5m
    labels:
      severity: critical
      class: H5
    annotations:
      summary: "H5 TLS certificate expires within 7 days: {{ $labels.instance }}"
      description: "The certificate expiry metric is within 7 days. Renew it immediately."
  - alert: H5_container_restart_burst
    expr: changes(container_start_time_seconds{name!=""}[15m]) > 1
    for: 2m
    labels:
      severity: warning
      class: H5
    annotations:
      summary: "H5 repeated container restarts: {{ $labels.name }} on {{ $labels.host }}"
      description: "The container start time changed more than once in 15m, indicating repeated restarts or recreates. Check Docker events and recent deploys."
  - alert: H5_container_unhealthy
    expr: container_health_state{name!=""} == 0
    for: 1m
    labels:
      severity: warning
      class: H5
    annotations:
      summary: "H5 unhealthy container: {{ $labels.name }} on {{ $labels.host }}"
      description: "cAdvisor reports a failed or starting Docker healthcheck for at least 1m. Check the container's healthcheck output."
  - alert: H5_postgres_connections_high
    expr: |
      sum by (host, instance_name) (pg_stat_database_numbackends{job="postgres"})
      /
      on (host, instance_name)
      max by (host, instance_name) (pg_settings_max_connections{job="postgres"}) > 0.85
    for: 5m
    labels:
      severity: warning
      class: H5
    annotations:
      summary: "H5 PostgreSQL connections above 85% on {{ $labels.instance_name }}"
      description: "PostgreSQL backend connections remained above 85% of max_connections for 5m. Check connection pools before clients are refused."
  - alert: H5_postgres_replication_lag
    expr: pg_replication_lag_seconds{job="postgres"} > 60
    for: 5m
    labels:
      severity: warning
      class: H5
    annotations:
      summary: "H5 PostgreSQL replication lag above 60s on {{ $labels.instance_name }}"
      description: "The replication lag metric remained above 60s for 5m. Check the standby and WAL receiver."
