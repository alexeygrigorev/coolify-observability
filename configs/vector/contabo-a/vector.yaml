data_dir: /var/lib/vector

sources:
  docker_logs:
    type: docker_logs
    exclude_containers:
      - vector-contabo-a
      - victoria-metrics
      - victoria-logs

  host_metrics:
    type: host_metrics
    scrape_interval_secs: 30
    collectors: [cpu, memory, disk, filesystem, load, network]

transforms:
  logs_remap:
    type: remap
    inputs: [docker_logs]
    source: |
      .host = "contabo-a"
      .fleet = "contabo-coolify"
      .timestamp = now()
      if !exists(.message) {
        .message = encode_json(.)
      }

sinks:
  vl_logs:
    type: http
    inputs: [logs_remap]
    uri: http://10.100.0.1:9428/insert/jsonline?_stream_fields=host,container_name&_msg_field=message&_time_field=timestamp
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    batch:
      max_bytes: 1048576
      timeout_secs: 5
    healthcheck:
      enabled: false

  vm_metrics:
    type: prometheus_remote_write
    inputs: [host_metrics]
    endpoint: http://10.100.0.1:8428/api/v1/write
    healthcheck:
      enabled: false
