data_dir: /var/lib/vector

sources:
  docker_logs:
    type: docker_logs
    exclude_containers:
      - vector-contabo-a
      - victoria-metrics
      - victoria-logs

  host_metrics:
    type: host_metrics
    scrape_interval_secs: 30
    collectors: [cpu, memory, disk, filesystem, load, network]

transforms:
  proxy_log_route:
    type: route
    inputs: [docker_logs]
    route:
      proxy: '.container_name == "coolify-proxy" || .container_name == "/coolify-proxy"'
      other: '.container_name != "coolify-proxy" && .container_name != "/coolify-proxy"'

  proxy_access_remap:
    type: remap
    inputs: [proxy_log_route.proxy]
    drop_on_error: true
    drop_on_abort: true
    source: |
      access, parse_error = parse_json(string!(.message))
      if parse_error != null {
        abort
      }
      if !is_object(access) ||
        !exists(access.ClientHost) ||
        !exists(access.RequestHost) ||
        !exists(access.RequestPath) ||
        !exists(access.DownstreamStatus) ||
        !exists(access.Duration) {
        abort
      }
      request_path_parts = split(string!(access.RequestPath), "?", limit: 2)
      container = string!(.container_name)
      log_timestamp = .timestamp
      . = {
        "host": "contabo-a",
        "fleet": "contabo-coolify",
        "container_name": container,
        "timestamp": log_timestamp,
        "message": "traefik_access",
        "client_host": access.ClientHost,
        "request_host": access.RequestHost,
        "request_path": request_path_parts[0],
        "status": access.DownstreamStatus,
        "duration_ns": access.Duration,
        "user_agent": get!(value: access, path: ["request_User-Agent"])
      }

  logs_remap:
    type: remap
    inputs: [proxy_log_route.other]
    source: |
      .host = "contabo-a"
      .fleet = "contabo-coolify"
      .timestamp = now()
      if !exists(.message) {
        .message = encode_json(.)
      }

sinks:
  vl_logs:
    type: http
    inputs: [logs_remap, proxy_access_remap]
    uri: http://10.100.0.1:9428/insert/jsonline?_stream_fields=host,container_name&_msg_field=message&_time_field=timestamp
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    batch:
      max_bytes: 1048576
      timeout_secs: 5
    healthcheck:
      enabled: false

  vm_metrics:
    type: prometheus_remote_write
    inputs: [host_metrics]
    endpoint: http://10.100.0.1:8428/api/v1/write
    healthcheck:
      enabled: false
