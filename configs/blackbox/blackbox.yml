# Blackbox prober for A1 HTTPS checks (prod-safe: probes public URLs, never stops them).
# Scraped by VM (see configs/vm/prometheus.yml job `blackbox-*`).
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 201, 202, 203, 204, 205, 206, 207, 208, 226, 300, 301, 302, 303, 304, 305, 307, 308]
      method: GET
      preferred_ip_protocol: ip4
