# CI/local fault-injection — VictoriaMetrics + VictoriaLogs + Mailpit + thin alerter
name: coolify-obs-drills

services:
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1::8025"]
    networks: [default, observer]
    mem_limit: 64m
    pids_limit: 32

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=1d
      - -memory.allowedBytes=67108864
      - -promscrape.config=/etc/vm/prometheus.yml
      - -httpListenAddr=:8428
    volumes:
      - ./configs/vm/prometheus.test.yml:/etc/vm/prometheus.yml:ro
    mem_limit: 128m
    environment:
      GOMAXPROCS: "2"
    networks: [default, observer]

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.15.0-victorialogs
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=1d
      - -memory.allowedBytes=67108864
      - -httpListenAddr=:9428
    mem_limit: 128m
    environment:
      GOMAXPROCS: "2"

  target-http:
    image: python:3.12-slim
    profiles: [full]
    command: [python, -u, /fixture/https.py]
    volumes:
      - ./tests/fixtures/drills:/fixture:ro
      - ${DRILL_CERT_DIR:?pytest generates test certificates}:/certs:ro
    mem_limit: 48m
    pids_limit: 32

  target-pg:
    image: postgres:16-alpine
    profiles: [full]
    environment:
      POSTGRES_PASSWORD: drill
      POSTGRES_USER: drill
      POSTGRES_DB: drill
    healthcheck:
      test: [CMD-SHELL, pg_isready -U drill]
      interval: 2s
      timeout: 2s
      retries: 15
    mem_limit: 128m
    pids_limit: 64

  canary:
    image: python:3.12-slim
    profiles: [full]
    command: [python, -u, /fixture/canary.py, serve]
    volumes:
      - ./tests/fixtures/drills:/fixture:ro
      - control:/control
      - logs:/logs
    tmpfs: [/pressure:size=64m]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 32
    cap_add: [SYS_RESOURCE]
    healthcheck:
      test: [CMD, python, /fixture/canary.py, health]
      interval: 1s
      timeout: 2s
      retries: 2

  restart-target:
    image: python:3.12-slim
    profiles: [full]
    command: [python, -u, /fixture/canary.py, restart]
    restart: "on-failure:5"
    volumes:
      - ./tests/fixtures/drills:/fixture:ro
      - control:/control:ro
    mem_limit: 32m
    pids_limit: 16

  vector:
    image: timberio/vector:0.60.0-debian
    profiles: [full]
    environment:
      VECTOR_THREADS: "1"
    volumes:
      - ./tests/fixtures/drills/vector.yaml:/etc/vector/vector.yaml:ro
      - logs:/logs:ro
    mem_limit: 96m
    pids_limit: 32

  smtp-proxy:
    image: python:3.12-slim
    profiles: [full]
    command: [python, -u, /fixture/smtp_proxy.py]
    volumes:
      - ./tests/fixtures/drills:/fixture:ro
    mem_limit: 32m
    pids_limit: 16

  drill-alerter:
    image: python:3.12-slim
    profiles: [full]
    volumes:
      - ./scripts/drill_alerter.py:/app/drill_alerter.py:ro
      - ${DRILL_CERT_DIR}:/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      ALERT_TO: dev@dtcdev.click
      SMTP_HOST: smtp-proxy
      HTTP_URL: https://target-http/
      SSL_CERT_FILE: /certs/ca.crt
      ALERT_HOLD: "4"
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-coolify-obs-drills}
    command: [python, -u, /app/drill_alerter.py]
    mem_limit: 64m
    pids_limit: 32
    networks: [default, observer]

  # Models a separately hosted observer: no monitored-service dependencies,
  # no sensor/socket access, and an independent network and SMTP path.
  external-deadman:
    image: python:3.12-slim
    profiles: [full]
    volumes:
      - ./scripts/drill_alerter.py:/app/drill_alerter.py:ro
    environment:
      MODE: deadman
      ALERT_TO: dev@dtcdev.click
      ALERT_HOLD: "4"
    command: [python, -u, /app/drill_alerter.py]
    mem_limit: 48m
    pids_limit: 32
    networks: [observer]

volumes:
  control:
  logs:

networks:
  default:
  observer:
