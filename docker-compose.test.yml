# Alert fault-injection drill stack — OpenObserve + Vector + Mailpit
# Do NOT point at Contabo prod.
name: coolify-obs-alert-drills

services:
  openobserve:
    image: openobserve/openobserve:v1.1.2
    environment:
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: Complexpass#123
      ZO_DATA_DIR: /data
      ZO_SMTP_HOST: mailpit
      ZO_SMTP_PORT: "1025"
      ZO_SMTP_USER_NAME: ""
      ZO_SMTP_PASSWORD: ""
      ZO_SMTP_FROM_EMAIL: obs-drill@example.com
      ZO_TELEMETRY: "false"
    ports:
      - "5080:5080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  vector:
    image: timberio/vector:0.60.0-debian
    user: root
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./vector/test/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      OPENOBSERVE_URL: http://openobserve:5080
      OPENOBSERVE_USER: root@example.com
      OPENOBSERVE_PASSWORD: Complexpass#123
    depends_on:
      openobserve:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  target-http:
    image: nginx:1.27-alpine
    profiles: ["targets"]
    ports:
      - "8080:80"
    labels:
      coolify.managed: "false"
      drill.target: "http"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 3

  target-pg:
    image: postgres:16-alpine
    profiles: ["targets"]
    environment:
      POSTGRES_PASSWORD: drill
      POSTGRES_USER: drill
      POSTGRES_DB: drill
    ports:
      - "5432:5432"
    labels:
      drill.target: "pg"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drill"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Tiny custom "alerter" for drills when OO SMTP/alert UI not yet scripted
  drill-alerter:
    image: python:3.12-alpine
    profiles: ["targets"]
    working_dir: /app
    volumes:
      - ./scripts/drill_alerter.py:/app/drill_alerter.py:ro
    command: ["python", "/app/drill_alerter.py"]
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      ALERT_TO: dev@dtcdev.click
    # real address set in test env
networks:
  default:
    name: coolify-obs-drills
