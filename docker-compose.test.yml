# CI/local fault-injection — VictoriaMetrics + VictoriaLogs + Mailpit + thin alerter
name: coolify-obs-drills

services:
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025"]

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=1d
      - -memory.allowedBytes=67108864
      - -promscrape.config=/etc/vm/prometheus.yml
      - -httpListenAddr=:8428
    volumes:
      - ./configs/vm/prometheus.test.yml:/etc/vm/prometheus.yml:ro
    mem_limit: 128m

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.15.0-victorialogs
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=1d
      - -memory.allowedBytes=67108864
      - -httpListenAddr=:9428
    mem_limit: 128m

  target-http:
    image: nginx:1.27-alpine
    profiles: ["targets", "full"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 2s
      retries: 5

  target-pg:
    image: postgres:16-alpine
    profiles: ["targets", "full"]
    environment:
      POSTGRES_PASSWORD: drill
      POSTGRES_USER: drill
      POSTGRES_DB: drill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drill"]
      interval: 3s
      timeout: 3s
      retries: 10

  drill-alerter:
    image: python:3.12-slim
    profiles: ["full"]
    working_dir: /app
    volumes:
      - ./scripts/drill_alerter.py:/app/drill_alerter.py:ro
    environment:
      ALERT_TO: "dev@dtcdev.click"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      HTTP_URL: http://target-http/
      PG_HOST: target-pg
      OO_HEALTH_URL: http://victoria-metrics:8428/health
      POLL_INTERVAL: "2"
    command: ["python", "-u", "/app/drill_alerter.py"]
    depends_on:
      - mailpit
      - target-http
      - target-pg
      - victoria-metrics

networks:
  default:
    name: coolify-obs-drills
