name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  biz-metrics-plumbing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install -r tests/requirements.txt

      - name: Run biz-metrics plumbing tests (no docker, no secrets)
        run: python -m pytest biz-metrics/tests/ -v --tb=short

  docker-alert-drills:
    env:
      COMPOSE_PROJECT_NAME: obs-drills-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DRILL_CERT_DIR: /tmp/obs-drill-certs-${{ github.run_id }}-${{ github.run_attempt }}
      GOMAXPROCS: "2"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install -r tests/requirements.txt

      - name: Run alert drill tests
        run: python -m pytest tests/ -v --tb=short

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.test.yml --profile full down -v --remove-orphans
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          test -z "$(docker network ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
