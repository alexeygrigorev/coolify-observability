# contabo-b: /data/lgtm/exporters/docker-compose.postgres.yml (project lgtm-pgexp)
# Credentials stay in the host's private .env. DATA_SOURCE_NAME_RELAY must use
# pg-relay's Docker hostname on coolify, never its container IP or WG bridge.
services:
  postgres-exporter-relay:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${DATA_SOURCE_NAME_RELAY}
    networks:
      - coolify
    ports:
      - '10.100.0.2:9187:9187'
    mem_limit: 128m

  postgres-exporter-shared:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${DATA_SOURCE_NAME_SHARED}
    ports:
      - '10.100.0.2:9188:9187'
    mem_limit: 128m

networks:
  coolify:
    external: true
